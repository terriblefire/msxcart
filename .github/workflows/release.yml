name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Get version info
      id: version
      run: |
        GITVERSION=$(git rev-parse --short HEAD)
        DATESTRING=$(date +"%Y_%m_%d")
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="snapshot_${DATESTRING}_${GITVERSION}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "gitversion=$GITVERSION" >> $GITHUB_OUTPUT
        echo "datestring=$DATESTRING" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"

    - name: Build CPLD firmware
      run: |
        cd boards
        GITVERSION=${{ steps.version.outputs.gitversion }}
        docker run --rm --platform linux/amd64 -v $PWD/..:/host -w /host/boards -e GITVERSION=$GITVERSION terriblefire78/xilinx:v1 bash -c "git config --global --add safe.directory /host && make"

    - name: Generate Gerbers
      run: |
        cd eagle
        GERBER_DIR="tfcart_${{ steps.version.outputs.gitversion }}_${{ steps.version.outputs.datestring }}"
        mkdir -p ${GERBER_DIR}
        docker run --rm --platform linux/amd64 -v $(pwd):/work -w /work terriblefire78/eagle:v1 eagle -X -dCAMJOB -jjlcpcb_4_layer_v9.cam -o${GERBER_DIR} tfcart.brd

    - name: Create Gerber ZIP
      run: |
        cd eagle
        GERBER_DIR="tfcart_${{ steps.version.outputs.gitversion }}_${{ steps.version.outputs.datestring }}"
        zip -r ${GERBER_DIR}.zip ${GERBER_DIR}

    - name: Generate schematic PDF
      run: |
        cd eagle
        docker run --rm --platform linux/amd64 -v $(pwd):/work -w /work terriblefire78/eagle-pdf python /app/generate_schematic_pdf.py tfcart.sch tfcart_${{ steps.version.outputs.gitversion }}_${{ steps.version.outputs.datestring }}.pdf

    - name: Generate BOM and CPL
      run: |
        cd eagle
        python3 extract_bom.py tfcart.sch tfcart_bom.csv
        python3 extract_cpl.py tfcart.brd tfcart_cpl.csv

    - name: Create release package
      run: |
        mkdir -p release
        VERSION=${{ steps.version.outputs.version }}
        PACKAGE_NAME="msxcart_${VERSION}"

        # Create package directory structure
        mkdir -p release/${PACKAGE_NAME}/{firmware,pcb,assembly,docs}

        # Copy firmware
        cp boards/*.zip release/${PACKAGE_NAME}/firmware/
        cp boards/msxcartr1/*.jed release/${PACKAGE_NAME}/firmware/ 2>/dev/null || true

        # Copy PCB files
        cp eagle/tfcart_*.zip release/${PACKAGE_NAME}/pcb/

        # Copy schematic
        cp eagle/tfcart_*.pdf release/${PACKAGE_NAME}/docs/

        # Copy assembly files
        cp eagle/tfcart_bom.csv release/${PACKAGE_NAME}/assembly/
        cp eagle/tfcart_cpl.csv release/${PACKAGE_NAME}/assembly/

        # Copy documentation
        cp README.md release/${PACKAGE_NAME}/docs/

        # Create README for the release
        {
          echo "MSX Cartridge Release"
          echo "====================="
          echo ""
          echo "This package contains all files needed to manufacture and program the MSX cartridge board."
          echo ""
          echo "Contents:"
          echo "---------"
          echo "firmware/       - CPLD programming files (.jed) and firmware package"
          echo "pcb/            - Gerber files for PCB manufacturing"
          echo "assembly/       - BOM and CPL files for PCB assembly"
          echo "docs/           - Schematic PDF and README"
          echo ""
          echo "Manufacturing:"
          echo "--------------"
          echo "1. Use the Gerber ZIP in pcb/ to order PCBs from your preferred manufacturer"
          echo "2. Use the BOM (Bill of Materials) and CPL (Component Placement List) in assembly/"
          echo "   for PCB assembly services like JLCPCB"
          echo "3. Program the CPLD using the JED file in firmware/"
          echo "   - msxcartr1_top.jed for MSX Cart revision 1"
          echo ""
          echo "Hardware:"
          echo "---------"
          echo "- Target Device: Xilinx XC9536XL-10-VQ44 CPLD"
          echo "- Interface: MSX cartridge slot (Z80 bus)"
          echo "- Memory Mapping: 4 switchable ROM pages"
          echo ""
          echo "For more information, visit: https://github.com/$(git config --get remote.origin.url | sed 's/.*github.com[:/]\(.*\)\.git/\1/')"
        } > release/${PACKAGE_NAME}/README.txt

        # Create release ZIP
        cd release
        zip -r ${PACKAGE_NAME}.zip ${PACKAGE_NAME}

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: msxcart-release-${{ steps.version.outputs.version }}
        path: release/msxcart_${{ steps.version.outputs.version }}.zip
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/msxcart_${{ steps.version.outputs.version }}.zip
        body: |
          MSX Cartridge Release ${{ steps.version.outputs.version }}

          This release includes:
          - CPLD firmware (JED files) for MSX cartridge
          - PCB Gerbers for manufacturing
          - BOM and CPL for assembly
          - Schematic PDF
          - Complete documentation

          See README.txt in the package for details.

          **Hardware Specifications:**
          - Xilinx XC9536XL-10-VQ44 CPLD
          - MSX MegaROM mapper with 4 switchable pages
          - Compatible with MSX computers
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
